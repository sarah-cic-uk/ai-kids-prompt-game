<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Operation Winterlight</title>
    <meta name="description" content="Operation Winterlight: a festive arcade adventure where young AI Rescue Agents learn to write great prompts." />
    <meta name="theme-color" content="#0a0f2e" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/pixelify-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/scenes.css" />
  </head>
  <body>
    <noscript>
      <div class="noscript">Operation Winterlight needs JavaScript switched on to play.</div>
    </noscript>

    <!-- Atmosphere: sky, aurora and snowfall sit behind every screen. -->
    <div class="sky" aria-hidden="true">
      <div class="sky-aurora a1"></div>
      <div class="sky-aurora a2"></div>
      <div class="sky-aurora a3"></div>
      <div class="sky-stars"></div>
    </div>
    <canvas id="snow" aria-hidden="true"></canvas>

    <header class="hud" id="hud" hidden>
      <button class="hud-agent" id="hud-agent" type="button" aria-label="Agent profile">
        <span class="hud-avatar" id="hud-avatar" aria-hidden="true"></span>
        <span class="hud-name" id="hud-name"></span>
        <span class="hud-mode" id="hud-mode"></span>
      </button>
      <div class="hud-stats">
        <div class="hud-stat hud-score" title="Total score">
          <span class="hud-ico" aria-hidden="true">★</span>
          <span class="sr-only">Score</span>
          <span id="hud-score">0</span>
        </div>
        <div class="hud-stat hud-streak" id="hud-streak-wrap" title="High-score streak">
          <span class="hud-ico" aria-hidden="true">🔥</span>
          <span class="sr-only">Streak</span>
          <span id="hud-streak">0</span>
        </div>
        <div class="hud-stat hud-nodes" title="Winterlight nodes restored">
          <span class="hud-ico" aria-hidden="true">◆</span>
          <span class="sr-only">Nodes restored</span>
          <span id="hud-nodes">0/6</span>
        </div>
      </div>
      <nav class="hud-actions" aria-label="Game menu">
        <button class="icon-btn" id="btn-map" type="button" aria-label="Mission map" title="Mission map">🗺</button>
        <button class="icon-btn" id="btn-board" type="button" aria-label="Leaderboard" title="Leaderboard">🏆</button>
        <button class="icon-btn" id="btn-sound" type="button" aria-label="Sound off" title="Sound" aria-pressed="false">🔇</button>
      </nav>
    </header>

    <div class="demo-ribbon" id="demo-ribbon" hidden>
      <span>Presenter mode</span>
      <button type="button" id="demo-exit">Exit</button>
    </div>

    <main id="app" tabindex="-1"></main>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
    <div class="modal-root" id="modal-root"></div>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>
    <div class="sr-only" id="sr-live" aria-live="assertive"></div>

    <!-- Scripts: plain files, no build step (works straight from GitHub Pages). -->
    <script src="js/config.js"></script>
    <script src="js/core/util.js"></script>
    <script src="js/services/storage.js"></script>
    <script src="js/data/missions.js"></script>
    <script src="js/data/achievements.js"></script>
    <script src="js/engine/evaluator-local.js"></script>
    <script src="js/engine/scoring.js"></script>
    <script src="js/services/evaluator.js"></script>
    <script src="js/services/leaderboard.js"></script>
    <script src="js/services/sound.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/ui/pixel.js"></script>
    <script src="js/ui/nova.js"></script>
    <script src="js/ui/scenes.js"></script>
    <script src="js/ui/fx.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/screens/welcome.js"></script>
    <script src="js/screens/map.js"></script>
    <script src="js/screens/mission.js"></script>
    <script src="js/screens/results.js"></script>
    <script src="js/screens/leaderboard.js"></script>
    <script src="js/screens/organiser.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
